[package]
name = "caesium-log"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A colorized logger that prefixes each line with the time elapsed since start, built on env_logger"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Cerclique/caesium"
keywords = ["logging", "logger", "elapsed", "color", "env_logger"]
categories = ["development-tools::debugging"]
include = ["src/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "caesium"

[dependencies]
env_logger = { version = "0.11.11", features = ["default"] }
log = "0.4.33"
thiserror = "2.0.19"

[[example]]
name = "main"
path = "examples/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
