# git-cliff configuration: generates docs/CHANGELOG.md from conventional commits.
# https://git-cliff.org/docs/configuration
#
# Regenerate:       git cliff -o docs/CHANGELOG.md
# Cut a release:    git cliff --bump -o docs/CHANGELOG.md   (next version from commit types)
#
# Merge commits are not conventional and are dropped with a "parse error(s)"
# warning; that is expected.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
This file is generated by [git-cliff](https://git-cliff.org) from the commit history.\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING:** {% endif %}\
          {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: <REPO>/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: <REPO>/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: <REPO>/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true
postprocessors = [
    { pattern = "<REPO>", replace = "https://github.com/Cerclique/lithium" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML comments only fix the section order; `striptags` drops them.
commit_parsers = [
    { message = "^chore\\(release\\)|^chore: release", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^build", group = "<!-- 5 -->Build" },
    { message = "^(ci|test|chore|style)", skip = true },
]
# Breaking changes are always listed, even when their type is skipped above.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
