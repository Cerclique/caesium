# Git hooks run by prek (https://github.com/j178/prek); see CONTRIBUTING.md.
# Install once per clone: prek install
default_install_hook_types: [pre-commit, pre-push]
# Hooks run at pre-commit unless they set `stages`.
default_stages: [pre-commit]

repos:
  # prek's built-in, offline versions of the pre-commit-hooks checks.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown line break.
        args: [--markdown-linebreak-ext=md]
        # Its manifest also enables pre-push; once at commit time is enough.
        stages: [pre-commit]
      - id: end-of-file-fixer
        # Generated by git-cliff, which ends it with a blank line.
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        # Cargo.toml holds the lint configuration.
        types_or: [rust, toml]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked --all-features
        language: system
        stages: [pre-push]
        # The README is a doctest, so any change can break the tests.
        always_run: true
        pass_filenames: false
