name: Bug report
description: Something doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or repository that shows the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The log lines or error you got, if any.
      render: text
  - type: input
    id: version
    attributes:
      label: lithium version
      description: Release tag or commit, e.g. `v0.2.1`.
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      description: e.g. Ubuntu 24.04 in GNOME Terminal, Windows 11 in Windows Terminal.
