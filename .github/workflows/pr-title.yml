name: PR title

# PRs are squash-merged with the PR title as the commit title, so the title must
# be a conventional commit for git-cliff to place it in the changelog.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the commit_parsers in cliff.toml.
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            ci
            test
            chore
            style
