name: Dev container

# Builds the dev container and runs the checks inside it, so it doesn't rot
# unnoticed. Not a required check: it only runs when .devcontainer/ changes.
on:
  pull_request:
    branches: ["main"]
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            prek --version
            cargo deny --version
            cargo semver-checks --version
            git cliff --version
            prek run --all-files
            cargo test --locked --all-features
